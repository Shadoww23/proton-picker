name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run unit tests
        run: python -m unittest test_proton.py test_dispatcher.py -v
      - name: Build release archives
        run: python scripts/package.py --output-dir artifacts
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip artifacts/*.tar.gz artifacts/*SHA256SUMS.txt
          --title "Proton Picker ${GITHUB_REF_NAME}"
          --notes-file CHANGELOG.md
